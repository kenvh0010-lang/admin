name: Mind & Margin — Background Video Factory & 24/7 YouTube Autopilot

on:
  push:
    paths:
      - 'content/*.json'
      - 'yt_studio/**'
      - '.github/workflows/video_factory.yml'
  schedule:
    # Runs automatically in the background every Tue, Thu, Sat, Sun at 13:00 UTC (20:00 VN / 08:00-09:00 US)
    - cron: '0 13 * * 2,4,6,0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - auto_publish_next
          - verify_youtube_only
          - rebuild_full_vault
        default: auto_publish_next
      privacy_status:
        description: 'YouTube upload privacy status (use unlisted to preview first!)'
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
      amazon_associate_tag:
        description: 'Optional override for Amazon Associate Tag (defaults to mindandmarg06-20)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mind-and-margin-video-factory-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg & Free Microsoft Neural TTS (edge-tts)
        run: |
          if [ "${{ inputs.mode }}" != "verify_youtube_only" ]; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu-core zip
          fi
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify YouTube Channel OAuth Connection (when verify_youtube_only selected)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_youtube_only' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 cli.py verify-youtube

      - name: Rebuild Public SEO Website & Sync Affiliate Tag (mindandmarg06-20)
        if: ${{ inputs.mode != 'verify_youtube_only' }}
        env:
          INPUT_TAG: ${{ inputs.amazon_associate_tag || vars.AMAZON_ASSOC_TAG || 'mindandmarg06-20' }}
        run: |
          python3 cli.py build-site ${INPUT_TAG:+--amazon-tag "$INPUT_TAG"}

      - name: Parallel Batch Render All 28 Weeks / 112 Videos (on code/script push or full rebuild)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild_full_vault') }}
        run: |
          python3 cli.py batch content/ --tts edge --voice en_authoritative --workers 4
          mkdir -p release_bundles
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          shorts = sorted(Path("output").glob("short_*"))
          longs = sorted(Path("output").glob("long_*"))
          total_weeks = min(len(longs), len(shorts) // 3)
          for w in range(1, total_weeks + 1):
              m = (w - 1) // 4 + 1
              s_dirs = shorts[(w - 1) * 3 : w * 3]
              l_dir = longs[w - 1]
              zip_name = f"release_bundles/month{m}_week{w:02d}_videos.zip"
              cmd = ["zip", "-r", zip_name] + [str(p) for p in s_dirs] + [str(l_dir)]
              subprocess.run(cmd, check=True)
              print(f"Packed {zip_name}")
          PY

      - name: Fast 24/7 YouTube Auto-Publish Next Queued Video + SRT + Thumbnail + Top Comment
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'auto_publish_next') }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy_status || 'public' }}
        run: |
          python3 cli.py publish-next --privacy "$PRIVACY"

      - name: Commit Updated Site, SEO Packs & Publish Ledger
        if: ${{ inputs.mode != 'verify_youtube_only' }}
        run: |
          git config user.name "Mind & Margin Autopilot"
          git config user.email "actions@github.com"
          git add docs/ products/bio_funnel_page/ output/
          if [ -f content/published_ledger.json ]; then git add content/published_ledger.json; fi
          git diff --cached --quiet || (git pull --rebase origin main && git commit -m "chore(autopilot): sync SEO site, upload packs & YouTube ledger [skip ci]" && git push)

      - name: Publish 28-Week / 196-Day Neural-Voiced MP4 Packs to GitHub Releases
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild_full_vault') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: q1-90day-neural-videos
          name: "🎬 Complete 28-Week Video Vault (112 Neural-Voiced MP4s — Weeks 1–28)"
          body: |
            ### 100% Automated Cloud Render — Full 196-Day / 28-Week Library (112 Fact-Checked Videos)!
            Download any weekly `.zip` bundle (`month1_week01` through `month7_week28`) containing ready-to-upload **1080x1920 Shorts (84)** & **1920x1080 Long-form Visual Essays (28)** with natural American English neural voiceover (`en-US-ChristopherNeural`), Ken Burns motion transitions, primary archival & academic citations, 100% copyright-free ambient music, `.srt` subtitles, high-CTR thumbnails, and copy-paste YouTube SEO descriptions (`mindandmarg06-20`).
          files: |
            release_bundles/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
