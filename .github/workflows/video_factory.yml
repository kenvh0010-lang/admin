name: Mind & Margin — Background Video Factory & Autopilot

on:
  push:
    paths:
      - 'content/*.json'
      - 'yt_studio/**'
      - '.github/workflows/video_factory.yml'
  schedule:
    # Runs automatically in the background every Tue, Thu, Sat, Sun at 13:00 UTC (20:00 VN / 08:00-09:00 US)
    - cron: '0 13 * * 2,4,6,0'
  workflow_dispatch:
    inputs:
      amazon_associate_tag:
        description: 'Optional Amazon Associate Tag (e.g., mindandmargin-20) to inject across site & descriptions'
        required: false
        default: ''
      auto_upload_youtube:
        description: 'Upload next unpublished video to YouTube if OAuth secrets are configured'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg & Free Microsoft Neural TTS (edge-tts)
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu-core zip
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild 48-Article Public SEO Website & Sync Affiliate Tag
        env:
          INPUT_TAG: ${{ inputs.amazon_associate_tag || vars.AMAZON_ASSOC_TAG }}
        run: |
          python3 cli.py build-site ${INPUT_TAG:+--amazon-tag "$INPUT_TAG"}

      - name: Parallel Batch Render All 48 Videos With American Neural Voiceover (edge-tts)
        run: |
          python3 cli.py batch content/ --tts edge --voice en_authoritative --workers 4
          mkdir -p release_bundles
          zip -r release_bundles/month1_week01_videos.zip output/short_01_* output/short_02_* output/short_03_* output/long_01_*
          zip -r release_bundles/month1_week02_videos.zip output/short_04_* output/short_05_* output/short_06_* output/long_02_*
          zip -r release_bundles/month1_week03_videos.zip output/short_07_* output/short_08_* output/short_09_* output/long_03_*
          zip -r release_bundles/month1_week04_videos.zip output/short_10_* output/short_11_* output/short_12_* output/long_04_*
          zip -r release_bundles/month2_week05_videos.zip output/short_13_* output/short_14_* output/short_15_* output/long_05_*
          zip -r release_bundles/month2_week06_videos.zip output/short_16_* output/short_17_* output/short_18_* output/long_06_*
          zip -r release_bundles/month2_week07_videos.zip output/short_19_* output/short_20_* output/short_21_* output/long_07_*
          zip -r release_bundles/month2_week08_videos.zip output/short_22_* output/short_23_* output/short_24_* output/long_08_*
          zip -r release_bundles/month3_week09_videos.zip output/short_25_* output/short_26_* output/short_27_* output/long_09_*
          zip -r release_bundles/month3_week10_videos.zip output/short_28_* output/short_29_* output/short_30_* output/long_10_*
          zip -r release_bundles/month3_week11_videos.zip output/short_31_* output/short_32_* output/short_33_* output/long_11_*
          zip -r release_bundles/month3_week12_videos.zip output/short_34_* output/short_35_* output/short_36_* output/long_12_*

      - name: Auto-Publish Next Queued Video to YouTube (if YouTube Secrets configured)
        if: ${{ github.event_name == 'schedule' || inputs.auto_upload_youtube == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 -m yt_studio.youtube_uploader public

      - name: Commit Updated Site, SEO Packs & Publish Ledger
        run: |
          git config user.name "Mind & Margin Autopilot"
          git config user.email "actions@github.com"
          git add docs/ products/bio_funnel_page/ output/ content/published_ledger.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(autopilot): sync 48-guide site, neural voice SEO packs & ledger [skip ci]" && git push)

      - name: Publish 90-Day Neural-Voiced MP4 Packs (48 Videos) to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: q1-90day-neural-videos
          name: "🎬 Quarter 1 Complete 90-Day Video Vault (48 Neural-Voiced MP4s — Weeks 1–12)"
          body: |
            ### 100% Automated Cloud Render — Full 90-Day / 12-Week Library (48 Videos)!
            Download any weekly `.zip` bundle (`month1_week01` through `month3_week12`) containing ready-to-upload **1080x1920 Shorts (36)** & **1920x1080 Long-form Visual Essays (12)** with natural American English neural voiceover (`en-US-ChristopherNeural`), 100% copyright-free ambient music, `.srt` subtitles, high-CTR thumbnails, and copy-paste YouTube SEO descriptions.
          files: |
            release_bundles/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
