name: Mind & Margin — Background Video Factory & 24/7 YouTube Autopilot

on:
  push:
    paths:
      - 'content/**/*.json'
      - 'assets/evidence/**'
      - 'yt_studio/**'
      - '.github/workflows/video_factory.yml'
  schedule:
    # Runs automatically every single day at 13:00 UTC (20:00 VN / 08:00-09:00 US Eastern peak RPM)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - auto_publish_next
          - verify_youtube_only
          - rebuild_full_vault
        default: auto_publish_next
      privacy_status:
        description: 'YouTube upload privacy status (use unlisted to preview first!)'
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
      amazon_associate_tag:
        description: 'Optional override for Amazon Associate Tag (defaults to mindandmarg06-20)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mind-and-margin-video-factory-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  produce-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg & Free Microsoft Neural TTS (edge-tts)
        timeout-minutes: 8
        run: |
          if [ "${{ inputs.mode }}" != "verify_youtube_only" ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              # GitHub-hosted runners cannot use Ubuntu apt right now:
              # azure.archive.ubuntu.com answers Ign, and archive.ubuntu.com
              # fails DNS ("Temporary failure resolving"). github.com is
              # reachable, so install a pinned static GPL build (libx264,
              # aac, zoompan) instead of apt-get.
              tmp=$(mktemp -d)
              tarball="ffmpeg-n8.1.3-34-ga35157abb9-linux64-gpl-8.1.tar.xz"
              url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-10-12-39/${tarball}"
              curl -fL --retry 3 --retry-delay 2 -o "$tmp/$tarball" "$url"
              echo "123ea674afacb01aa0258153def409995f854af9a352eb14e1180745926f2d09  $tmp/$tarball" | sha256sum -c -
              tar -xJf "$tmp/$tarball" -C "$tmp"
              bin=$(find "$tmp" -type f -name ffmpeg | head -1)
              probe=$(find "$tmp" -type f -name ffprobe | head -1)
              if [ -z "$bin" ]; then
                echo "ffmpeg binary not found in static archive" >&2
                exit 1
              fi
              sudo install -m 0755 "$bin" /usr/local/bin/ffmpeg
              if [ -n "$probe" ]; then
                sudo install -m 0755 "$probe" /usr/local/bin/ffprobe
              fi
              rm -rf "$tmp"
            fi
            if ! command -v zip >/dev/null 2>&1; then
              echo "zip is not on this runner" >&2
              exit 1
            fi
            python3 -c "from yt_studio.config import resolve_font_path; resolve_font_path(True); resolve_font_path(False)"
            ffmpeg -hide_banner -version
            ffmpeg -hide_banner -filters | grep -q zoompan
            ffmpeg -hide_banner -encoders | grep -q libx264
            ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=64x64:d=0.1 -frames:v 2 -c:v libx264 -f null -
          fi
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify YouTube Channel OAuth Connection (when verify_youtube_only selected)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_youtube_only' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 cli.py verify-youtube

      - name: Audit Project Uniqueness, 7-Gate Validation & Rebuild Public SEO Website (mindandmarg06-20)
        if: ${{ inputs.mode != 'verify_youtube_only' }}
        env:
          INPUT_TAG: ${{ inputs.amazon_associate_tag || vars.AMAZON_ASSOC_TAG || 'mindandmarg06-20' }}
        run: |
          python3 cli.py dedupe --apply
          python3 cli.py validate content/
          python3 cli.py build-site ${INPUT_TAG:+--amazon-tag "$INPUT_TAG"}

      - name: Cache Rendered Video Vault (Incremental SHA-256 Manifests)
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild_full_vault') }}
        uses: actions/cache@v4
        with:
          path: output
          key: video-vault-v23-${{ hashFiles('yt_studio/**', 'content/**/*.json', 'assets/evidence/**') }}
          restore-keys: |
            video-vault-v23-

      - name: Parallel Batch Render Evidence-Based Videos & Bundle Deduplicated Vault Zip
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild_full_vault') }}
        run: |
          python3 cli.py batch content/ --tts edge --voice en_authoritative --workers 4 --skip-existing
          mkdir -p release_bundles
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from yt_studio.config import CONTENT_DIR, discover_storyboards, natural_sort_key

          active_stems = {p.stem for p in discover_storyboards(CONTENT_DIR)}
          rendered_dirs = sorted(
              (
                  d for d in Path("output").iterdir()
                  if d.is_dir() and d.name in active_stems and list(d.glob("*.mp4"))
              ),
              key=natural_sort_key,
          )
          if not rendered_dirs:
              raise SystemExit("No rendered MP4 directories found in output/")

          vault_zip = "release_bundles/evidence_shorts_complete_vault.zip"
          subprocess.run(
              ["zip", "-r", vault_zip] + [str(d) for d in rendered_dirs] + ["-x", "*/.render_manifest.json"],
              check=True,
          )
          print(f"Packed deduplicated {vault_zip} ({len(rendered_dirs)} active videos)")
          PY

      - name: Publish Neural-Voiced Evidence Video Packs to GitHub Releases
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild_full_vault') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: evidence-shorts-vault
          name: "🎬 Evidence-Based Video Vault (Neural 9:16 Shorts + 16:9 Long-Form Essays)"
          body: |
            ### 100% Automated Cloud Render — Evidence-Based Documentary Video Vault!
            Download `evidence_shorts_complete_vault.zip` (or individual 5-video packs) containing ready-to-upload **1080x1920 Shorts** and **1920x1080 Long-Form Essays** rendered with:
            - **Real Primary Exhibits (`assets/evidence/`)**: Actual SDNY court filings, SEC administrative orders, FTC refund notices, Federal Reserve SHED data, and MIT Sloan study exhibits framed cleanly inside every video.
            - **Natural American English Neural Voiceover** (`en-US-ChristopherNeural`) + original ambient audio bed.
            - **Synced `.srt` Captions, High-CTR Thumbnails & Copy-Paste YouTube SEO Packs** with clickable primary source URLs and Amazon Associate disclosure (`mindandmarg06-20`).
          files: |
            release_bundles/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast 24/7 YouTube Auto-Publish Next Queued Video + SRT + Thumbnail + Top Comment
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'auto_publish_next') }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy_status || 'public' }}
        run: |
          python3 cli.py publish-next --privacy "$PRIVACY"

      - name: Commit Updated Site, SEO Packs & Publish Ledger
        if: ${{ inputs.mode != 'verify_youtube_only' && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        run: |
          git config user.name "Mind & Margin Autopilot"
          git config user.email "actions@github.com"
          # The render cache can restore output/ dirs of retired scripts; prune them before staging.
          python3 cli.py dedupe --apply
          git add -A docs/ products/bio_funnel_page/ output/
          if [ -f content/published_ledger.json ]; then git add content/published_ledger.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(autopilot): sync SEO site, upload packs & YouTube ledger [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
